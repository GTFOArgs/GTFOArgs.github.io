<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" shape-rendering="crispEdges">
  <!-- Black border frame -->
  <rect x="0" y="0" width="20" height="1" fill="#000"/>
  <rect x="0" y="19" width="20" height="1" fill="#000"/>
  <rect x="0" y="0" width="1" height="20" fill="#000"/>
  <rect x="19" y="0" width="1" height="20" fill="#000"/>
  <!-- Black notches where hash meets border -->
  <rect x="1" y="7" width="2" height="1" fill="#000"/>
  <rect x="17" y="7" width="2" height="1" fill="#000"/>
  <rect x="1" y="12" width="2" height="1" fill="#000"/>
  <rect x="17" y="12" width="2" height="1" fill="#000"/>
  <!-- Orange hash symbol -->
  <rect x="4" y="6" width="12" height="2" fill="#FF5126"/>
  <rect x="4" y="12" width="12" height="2" fill="#FF5126"/>
  <rect x="6" y="4" width="2" height="12" fill="#FF5126"/>
  <rect x="12" y="4" width="2" height="12" fill="#FF5126"/>
</svg>
